[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sofatui"
version = "1.0.0"
description = "A rich, SofaScore-style terminal UI (TUI) for live football scores, match statistics, Attack Momentum, commentary, lineups, player ratings, and standings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0",
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/wthernani/sofatui"
Repository = "https://github.com/wthernani/sofatui"
Issues = "https://github.com/wthernani/sofatui/issues"

[project.scripts]
sofatui = "sofatui.app:main"
scores-tui = "sofatui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
